name: Build Marko Dobavnica APK
on:
  push:
    paths:
      - 'android-marko/**'
      - '.github/workflows/build-marko-apk.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build installable debug APK
        working-directory: android-marko
        run: gradle --no-daemon assembleDebug
      - name: Prepare public APK
        if: github.ref == 'refs/heads/main'
        run: cp android-marko/app/build/outputs/apk/debug/app-debug.apk Dobavnica-PRO-Marko.apk
      - name: Publish APK to GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view marko-apk-latest >/dev/null 2>&1 || gh release create marko-apk-latest --title "Dobavnica PRO Marko - Android APK" --notes "Testna Android APK različica. Namestitev zunaj Google Play; pred redno uporabo preverite tiskanje."
          gh release upload marko-apk-latest Dobavnica-PRO-Marko.apk --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: Dobavnica-PRO-Marko-Android-APK
          path: android-marko/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
